<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Registration — SafeCity AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <span>SafeCity <span style="color: var(--accent-cyan);">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-sm btn-outline">Sign In Instead</a>
      </div>
    </div>
  </header>

  <!-- Signup Form Container -->
  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">
    <div class="card" style="width: 100%; max-width: 540px; padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 52px; height: 52px; border-radius: var(--radius-md); background: rgba(6, 182, 212, 0.12); color: var(--accent-cyan); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem; border: 1px solid var(--border-highlight);">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 style="font-size: 1.65rem; font-weight: 800; letter-spacing: -0.02em;">Create SafeCity Account</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">
          Join the smart civic intelligence network to report issues and navigate safely
        </p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name *</label>
          <input type="text" id="signup-name" class="form-input" placeholder="e.g. Priya Sharma" required minlength="2">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address *</label>
          <input type="email" id="signup-email" class="form-input" placeholder="priya@example.com" required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="signup-password">Password (min 6 chars) *</label>
            <input type="password" id="signup-password" class="form-input" placeholder="••••••••" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-phone">Phone Number</label>
            <input type="tel" id="signup-phone" class="form-input" placeholder="+91 98765 43210">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-role">Account Type</label>
          <select id="signup-role" class="form-select">
            <option value="citizen">Citizen (Standard Civic & Navigation Account)</option>
            <option value="officer">Municipal Officer (Demonstration Verification Access)</option>
          </select>
        </div>

        <!-- Emergency Contact Section -->
        <div style="background: var(--bg-surface); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
          <div style="font-size: 0.85rem; font-weight: 700; color: var(--accent-cyan-light); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.4rem;">
            <i class="fa-solid fa-heart-pulse"></i> Designated Emergency Contact (Optional)
          </div>
          <div class="grid-2">
            <div>
              <label class="form-label" for="signup-ec-name" style="font-size: 0.8rem;">Contact Name</label>
              <input type="text" id="signup-ec-name" class="form-input" placeholder="e.g. Rohit Sharma (Brother)">
            </div>
            <div>
              <label class="form-label" for="signup-ec-phone" style="font-size: 0.8rem;">Emergency Phone</label>
              <input type="tel" id="signup-ec-phone" class="form-input" placeholder="+91 98765 11111">
            </div>
          </div>
        </div>

        <div id="signup-error" style="display: none; background: var(--color-danger-bg); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

        <button type="submit" id="btn-signup-submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
          <i class="fa-solid fa-user-check"></i> Register Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
        Already registered? <a href="login.html" style="color: var(--accent-cyan-light); font-weight: 600; text-decoration: none;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signup-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        const phone = document.getElementById('signup-phone').value.trim();
        const role = document.getElementById('signup-role').value;
        const ecName = document.getElementById('signup-ec-name').value.trim();
        const ecPhone = document.getElementById('signup-ec-phone').value.trim();
        
        const btn = document.getElementById('btn-signup-submit');
        const errBox = document.getElementById('signup-error');

        errBox.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="width:16px; height:16px;"></span> Creating Account...';

        try {
          const user = await Auth.signup({
            name,
            email,
            password,
            phone,
            role,
            emergency_contact_name: ecName,
            emergency_contact_phone: ecPhone
          });

          SafeCity.showToast(`Account registered! Welcome to SafeCity, ${user.name}!`, 'success');

          setTimeout(() => {
            if (user.role === 'officer') {
              window.location.href = 'officer-dashboard.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }, 800);

        } catch (err) {
          errBox.textContent = err.message || 'Registration failed. Please check your inputs.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-user-check"></i> Register Account';
        }
      });
    });
  </script>
</body>
</html>
