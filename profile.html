<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — SafeCity AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <span>SafeCity <span style="color: var(--accent-cyan);">AI</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="dashboard.html" class="nav-link"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
        <li><a href="report.html" class="nav-link"><i class="fa-solid fa-camera"></i> Report Issue</a></li>
        <li><a href="route.html" class="nav-link"><i class="fa-solid fa-route"></i> SafeRoute</a></li>
      </ul>

      <div class="nav-actions">
        <div id="nav-auth-container"></div>
        <button class="mobile-menu-btn" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <!-- Profile Workspace -->
  <main class="main-content" style="max-width: 680px;">
    <div class="card" style="padding: 2.5rem; margin-bottom: 2rem;">
      <div style="display: flex; align-items: center; gap: 1.25rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem;">
        <div style="width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800;">
          <span id="profile-avatar-char">U</span>
        </div>
        <div>
          <h1 id="profile-name" style="font-size: 1.65rem; font-weight: 800; margin-bottom: 0.25rem;">Loading...</h1>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span id="profile-role-badge" class="badge badge-progress">Citizen</span>
            <span id="profile-email" style="font-size: 0.85rem; color: var(--text-secondary);">user@safecity.org</span>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 1.25rem; margin-bottom: 2rem;">
        <div style="background: var(--bg-surface); padding: 1rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
          <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Registered Phone Number</div>
          <div id="profile-phone" style="font-weight: 600; font-size: 1rem; margin-top: 0.2rem;">Not provided</div>
        </div>

        <div style="background: var(--bg-surface); padding: 1rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
          <div style="font-size: 0.75rem; color: var(--accent-cyan-light); text-transform: uppercase; font-weight: 700;">Designated Emergency Contact</div>
          <div id="profile-ec-name" style="font-weight: 600; font-size: 1rem; margin-top: 0.2rem;">Rohit Sharma (Brother)</div>
          <div id="profile-ec-phone" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">+91 98765 11111</div>
        </div>

        <div style="background: var(--bg-surface); padding: 1rem 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
          <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Member Since</div>
          <div id="profile-joined" style="font-weight: 600; font-size: 0.95rem; margin-top: 0.2rem;">October 2026</div>
        </div>
      </div>

      <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
        <button onclick="Auth.logout()" class="btn btn-secondary" style="color: var(--color-danger); border-color: rgba(239, 68, 68, 0.3);">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out of Session
        </button>
        <a href="dashboard.html" class="btn btn-primary" style="flex: 1;">
          <i class="fa-solid fa-gauge"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-bottom">
      <div>&copy; 2026 SafeCity AI User Profile.</div>
      <div><a href="about.html" style="color: var(--text-muted);">Privacy</a></div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      if (!Auth.requireAuth()) return;

      const user = Auth.user;
      document.getElementById('profile-name').textContent = user.name;
      document.getElementById('profile-email').textContent = user.email;
      document.getElementById('profile-phone').textContent = user.phone || 'None recorded';
      document.getElementById('profile-avatar-char').textContent = user.name.charAt(0).toUpperCase();

      const roleBadge = document.getElementById('profile-role-badge');
      if (user.role === 'officer' || user.role === 'admin') {
        roleBadge.className = 'badge badge-fixed';
        roleBadge.textContent = 'Municipal Officer';
      } else {
        roleBadge.className = 'badge badge-progress';
        roleBadge.textContent = 'Citizen';
      }

      if (user.emergency_contact_name) {
        document.getElementById('profile-ec-name').textContent = user.emergency_contact_name;
        document.getElementById('profile-ec-phone').textContent = user.emergency_contact_phone || 'No phone set';
      }
    });
  </script>
</body>
</html>
